<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Static Water Bending - Physics Lab</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .water-sim { position: relative; width: 600px; height: 500px; background: #2c3e50; margin: 0 auto; border: 4px solid #34495e; overflow: hidden; }
        .balloon { width: 60px; height: 80px; background: #e74c3c; border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; position: absolute; cursor: grab; }
        .tap { position: absolute; top: 0; left: 280px; width: 40px; height: 20px; background: #bdc3c7; }
        .drop { width: 4px; height: 10px; background: #3498db; position: absolute; border-radius: 2px; }
    </style>
</head>
<body>
    <header>
        <h1>Static Water Bending</h1>
        <p>Polarization & Electrostatic Attraction</p>
        <a href="../index.html" class="btn" style="background: var(--accent);">Back to Menu</a>
    </header>
    <main class="container">
        <div class="sim-container">
            <div class="water-sim" id="simArea">
                <div class="tap"></div>
                <div class="balloon" id="balloon" style="top: 200px; left: 400px;"></div>
            </div>
            <div class="controls">
                <p>Drag the balloon near the water stream!</p>
                <div class="control-group">
                    <label>Balloon Charge: <span id="chargeVal">Negative</span></label>
                    <input type="range" id="chargeRange" min="-10" max="10" value="-5">
                </div>
            </div>
        </div>
        <div class="info-section sim-container">
            <h3>How it works</h3>
            <p>Water molecules are polar. When a charged balloon is brought near, it attracts the opposite partial charges in the water, causing the stream to bend.</p>
        </div>
    </main>
    <script>
        const simArea = document.getElementById('simArea');
        const balloon = document.getElementById('balloon');
        let drops = [];

        // Drag logic
        let isDragging = false;
        balloon.onmousedown = () => isDragging = true;
        document.onmouseup = () => isDragging = false;
        document.onmousemove = (e) => {
            if (!isDragging) return;
            const rect = simArea.getBoundingClientRect();
            balloon.style.left = (e.clientX - rect.left - 30) + 'px';
            balloon.style.top = (e.clientY - rect.top - 40) + 'px';
        };

        function createDrop() {
            const drop = document.createElement('div');
            drop.className = 'drop';
            drop.style.left = '298px';
            drop.style.top = '20px';
            simArea.appendChild(drop);
            drops.push({ el: drop, x: 298, y: 20, vx: 0, vy: 2 });
        }

        function animate() {
            if (Math.random() > 0.5) createDrop();
            
            const bx = parseFloat(balloon.style.left) + 30;
            const by = parseFloat(balloon.style.top) + 40;
            const charge = parseFloat(document.getElementById('chargeRange').value);

            drops.forEach((d, i) => {
                const dx = bx - d.x;
                const dy = by - d.y;
                const distSq = dx*dx + dy*dy;
                
                if (distSq < 40000) {
                    const force = (charge * 50) / distSq;
                    d.vx += force * (dx / Math.sqrt(distSq));
                }

                d.x += d.vx;
                d.y += d.vy;
                d.vy += 0.1; // Gravity

                d.el.style.left = d.x + 'px';
                d.el.style.top = d.y + 'px';

                if (d.y > 500) {
                    simArea.removeChild(d.el);
                    drops.splice(i, 1);
                }
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
